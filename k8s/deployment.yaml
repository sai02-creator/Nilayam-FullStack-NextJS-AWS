apiVersion: apps/v1
kind: Deployment
metadata:
  name: nilayam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nilayam
  template:
    metadata:
      labels:
        app: nilayam
    spec:
      containers:
        - name: nilayam
          image: nilayam:clean
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: nilayam-secrets
